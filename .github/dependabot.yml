# Dependabot: riippuvuuksien haavoittuvuus- ja päivitystarkistukset
# (arkkitehtuuri §14: "riippuvuuksien haavoittuvuusskannaus CI-putkessa").
#
# Hälytykset ja turvapäivitykset kytketään repossa erikseen:
# Settings → Code security and analysis → Dependabot alerts / security updates.
version: 2
updates:
  # npm-workspaces: juuren package-lock.json kattaa apps/, packages/ ja infra/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      aws-cdk:
        patterns:
          - 'aws-cdk*'
          - '@aws-cdk/*'
          - 'constructs'
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - 'aws-cdk*'
          - '@aws-cdk/*'
          # typescript on oma ryhmänsä (ks. alla), jotta dev-tooling-ryhmä ei
          # voi koskaan sisältää sen major-hyppyä (ks. ignore jäljempänä).
          - 'typescript'
      # TypeScript omana ryhmänään: vain minor- ja patch-päivitykset.
      # Major-hyppy (7.x) on blokattu ignoressa, koska typescript-eslint
      # ei tue sitä vielä.
      typescript:
        patterns:
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'

    # typescript-eslint 8.x — myös canary 8.71.1-alpha — tukee vain
    # typescript <6.1.0, joten TypeScript 7:n major-hyppy kaataa `npm ci`:n
    # ERESOLVE-virheeseen (havaittu 4.10.2026, dev-tooling-ryhmä). Blokataan
    # toistaiseksi vain TS:n major; muut dev-tooling-päivitykset kulkevat
    # normaalisti (ne on verifioitu: build, lint, format, 645 testiä, synth).
    # HUOM: ilman tähteä `dependency-name` osuu vain täsmälleen samannimiseen
    # pakettiin, ei siis typescript-eslintiin (ks. Dependabot options
    # reference). Poista tämä sääntö, kun typescript-eslint tukee TS 7:ää.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # .github/workflows/** ja .github/actions/** -toimintojen versiot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
